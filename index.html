<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Non-Standard Machine Skill & Work Readiness Matrix</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700;800&display=swap">
<style>
:root{--bg:#e9eef6;--panel:#fff;--ink:#102a52;--mute:#5d6f8b;--line:#cfd9e8;--navy:#0b2a5b;--navy2:#123c7c;--eqh:#eaf1fc;--row:#f6f9ff;--yel:#ffd21f;
--t0:#0b9a4a;--t1:#f9c70c;--t2:#f26a0f;--t3:#e1262c;--c0:#0a8a47;--c1:#8c7800;--c2:#e0600a;--c3:#d4202a;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1624;--panel:#132238;--ink:#e4ecf7;--mute:#9fb2cc;--line:#28405f;--navy:#0a1d3d;--navy2:#14335f;--eqh:#17304f;--row:#101d31;--c0:#3fd486;--c1:#f2cf3a;--c2:#ff914a;--c3:#ff6b6f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c1624;--panel:#132238;--ink:#e4ecf7;--mute:#9fb2cc;--line:#28405f;--navy:#0a1d3d;--navy2:#14335f;--eqh:#17304f;--row:#101d31;--c0:#3fd486;--c1:#f2cf3a;--c2:#ff914a;--c3:#ff6b6f;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.4 "Noto Sans Thai","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
main{max-width:1500px;margin:0 auto;padding:12px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--yel);outline-offset:2px}
.banner{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;background:var(--navy);color:#fff;border-radius:14px 14px 0 0;padding:14px 18px}
.brand{display:flex;gap:14px;align-items:center}
h1{margin:0;font-size:clamp(1.1rem,2.1vw,1.55rem);font-weight:800;letter-spacing:.01em;line-height:1.15}
.sub{margin:4px 0 0;color:var(--yel);font-weight:700;font-size:clamp(.95rem,1.8vw,1.2rem)}
.legend{background:#fff;color:#12284c;border-radius:10px;padding:8px 14px;text-align:center}
.legend b{display:block;font-size:.85rem;letter-spacing:.02em}
.legend div{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center;font-size:.78rem;margin-top:4px}
.legend span{display:flex;align-items:center;gap:5px;white-space:nowrap}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block}
.bar{display:flex;gap:8px;justify-content:flex-end;padding:8px 0}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 12px;font-weight:500}
.btn:hover{border-color:var(--navy2)}
.btn.pri{background:var(--navy2);border-color:var(--navy2);color:#fff}
.wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:0 0 0 0}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:1750px}
th,td{padding:5px 6px;text-align:center;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
thead th{background:var(--navy);color:#fff;font-weight:700;font-size:.8rem;line-height:1.2;border-color:rgba(255,255,255,.14)}
thead th.eq{background:var(--eqh);color:var(--navy2);font-size:.72rem;font-weight:700;min-width:62px;vertical-align:bottom;border-color:var(--line)}
:root[data-theme="dark"] thead th.eq{color:#bcd3f2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) thead th.eq{color:#bcd3f2}}
thead th.grp{background:var(--navy2)}
thead svg{display:block;margin:0 auto 3px;opacity:.85}
.nm{position:sticky;left:0;z-index:2;text-align:left;min-width:180px;background:var(--panel)}
thead .nm{z-index:3;background:var(--navy);text-align:center}
tbody tr:nth-child(even) td,tbody tr:nth-child(even) .nm{background:var(--row)}
.nm b{display:block;font-size:.88rem;color:var(--navy2)}
:root[data-theme="dark"] .nm b{color:#cfe0fa}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .nm b{color:#cfe0fa}}
.nm i{font-style:normal;font-size:.76rem;color:var(--mute)}
td.pc{font-weight:800;font-size:.95rem;cursor:pointer}
td.pc:hover{background:var(--eqh)}
.c0{color:var(--c0)}.c1{color:var(--c1)}.c2{color:var(--c2)}.c3{color:var(--c3)}
td.ov{font-weight:800;font-size:1rem}
.pf svg{display:block;margin:auto}
.st{display:inline-flex;align-items:center;gap:6px;min-width:104px;justify-content:center;padding:5px 10px;border-radius:6px;color:#fff;font-weight:700;font-size:.82rem}
.st.t1{color:#3a2f00}
.st.t0{background:var(--t0)}.st.t1{background:var(--t1)}.st.t2{background:var(--t2)}.st.t3{background:var(--t3)}
.foot{display:grid;grid-template-columns:minmax(220px,1fr) 3fr;gap:12px;margin-top:12px}
.note,.team{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.note b{display:block;margin-bottom:4px}
.note ul{margin:0;padding-left:18px;color:var(--mute);font-size:.82rem}
.team h2{margin:-24px 0 10px;display:inline-block;background:var(--navy2);color:#fff;font-size:.78rem;padding:3px 16px;border-radius:12px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.kp div{text-align:center;color:var(--mute);font-size:.8rem}
.kp strong{display:block;font-size:1.6rem;line-height:1.2}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);padding:0;width:min(520px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(5,12,24,.55)}
.dlg{padding:18px;display:grid;gap:12px;max-height:80vh;overflow:auto}
.dlg h2{margin:0;font-size:1.05rem}
.dlg p{margin:0;color:var(--mute)}
.dlg ol{margin:0;padding-left:22px}
.dlg label{display:grid;gap:4px;font-size:.88rem;color:var(--mute)}
input[type=text],input[type=number]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;width:100%}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.acts{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy2);color:#fff;padding:8px 14px;border-radius:6px;font-size:.88rem;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
@media (max-width:720px){.foot{grid-template-columns:1fr}.team h2{margin-top:0}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
.btn[hidden]{display:none}
thead th.eq img{display:block;margin:0 auto 4px;max-width:56px;max-height:48px;object-fit:contain}
.im{display:block;width:100%;min-height:44px;background:var(--panel);border:1px dashed var(--line);border-radius:6px;padding:2px;margin-bottom:4px}
.im img{margin:0 auto}
.en,.in{font:inherit;font-size:.8rem;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:4px 6px;width:100%}
.en{text-align:center;font-size:.72rem}
.in.sm{margin-top:4px;font-size:.74rem}
.pi{font:inherit;font-weight:800;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:4px 2px}
.pi.c0{color:var(--c0)}.pi.c1{color:var(--c1)}.pi.c2{color:var(--c2)}.pi.c3{color:var(--c3)}
.x{border:0;background:none;color:var(--c3);font-weight:700;padding:2px 6px;line-height:1}
.nm .x{position:absolute;top:2px;right:2px}
.toast.act{pointer-events:auto}
.ub{margin-left:10px;background:none;border:1px solid #fff;color:#fff;border-radius:4px;padding:1px 8px}
.pi{width:76px;-moz-appearance:textfield}
.pi::-webkit-outer-spin-button,.pi::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.ed thead th.eq{min-width:92px}
.bar{justify-content:space-between;flex-wrap:wrap;align-items:flex-end}
.tabs,.tools{display:flex;gap:8px;flex-wrap:wrap}
.tabs .btn[aria-pressed="true"]{background:var(--navy2);border-color:var(--navy2);color:#fff}
.rk{display:flex;flex-wrap:wrap;gap:6px 10px;margin:0 0 12px;font-size:.78rem;color:var(--mute)}
.kc{display:inline-flex;align-items:center;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:2px 8px}
.kc img{height:18px;width:auto}.kc b{color:var(--ink)}
.rg{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.rc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;display:grid;gap:4px;justify-items:center}
.rc:hover{border-color:var(--navy2)}
.rc h3{margin:0;font-size:.98rem}
.rc i{font-style:normal;font-size:.76rem;color:var(--mute)}
.rc svg{max-width:100%;height:auto}
.rs{display:flex;gap:10px;align-items:center}.rs strong{font-size:1.2rem}
.rc small{color:var(--mute)}
.note textarea{width:100%;min-height:110px;font:inherit;font-size:.82rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;margin-top:6px}
.note .btn{padding:2px 8px;font-size:.76rem;margin-left:8px}
#rd{width:min(640px,calc(100vw - 24px))}
#rd svg{display:block;margin:auto;max-width:100%;height:auto}
:root{--floor:#d6dae0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--floor:#26364a}}
:root[data-theme="dark"]{--floor:#26364a}
.sv{align-self:center;font-size:.78rem;color:var(--mute);margin-right:4px}
.sv.w{color:var(--c1)}.sv.e{color:var(--c3)}
tfoot td,tfoot th{background:var(--eqh);font-weight:800;border-top:2px solid var(--line)}
tfoot .nm{background:var(--eqh);font-size:.8rem}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.mc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px;text-align:center;align-content:start}
.mc h3{margin:0;font-size:.95rem}
.mi{width:100%;aspect-ratio:4/3;background:var(--eqh);border:1px dashed var(--line);border-radius:8px;display:grid;place-items:center;align-content:center;gap:2px;color:var(--mute);font-size:.8rem;padding:4px;overflow:hidden}
.mi:disabled{cursor:default}
.mi img{max-width:100%;max-height:100%;object-fit:contain}
.mavg{font-size:1.5rem;font-weight:800;line-height:1}
.mbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.mbar i{display:block;height:100%}
.chs{display:flex;flex-wrap:wrap;gap:4px 10px;justify-content:center;font-size:.76rem;color:var(--mute)}
.chp{display:inline-flex;align-items:center;gap:4px}
.mc small{color:var(--mute)}
.lbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
#sites{display:flex;gap:6px;flex-wrap:wrap}
#sites .btn[aria-pressed="true"]{background:var(--navy2);border-color:var(--navy2);color:#fff}
.lbar input{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px;min-width:220px}
.lbar .rk{margin:0}
.zm{display:flex;gap:4px;align-items:center;margin-left:auto;color:var(--mute);font-size:.82rem}
.lw{overflow:auto;max-height:72vh;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.lw svg{display:block}
.vf{cursor:pointer;color:var(--ink)}
.vf.on{border-color:var(--navy2);box-shadow:0 0 0 2px var(--navy2)}
.lcard,.allm{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-top:12px}
.lcard h3,.allm h3{margin:0 0 6px;font-size:1rem}
.allm p{margin:0 0 8px;color:var(--mute)}
.lcard dl{display:grid;grid-template-columns:max-content 1fr;gap:2px 14px;margin:0}
.lcard dt{color:var(--mute)}.lcard dd{margin:0}
.amt{min-width:0;width:min(520px,100%)}
.amt td:first-child{text-align:left}
.amt th:first-child{text-align:left}
#map{user-select:none;-webkit-user-select:none}
.ledit [data-i]{cursor:grab;touch-action:none}
.lf{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:8px}
.lf label{display:grid;gap:4px;font-size:.84rem;color:var(--mute)}
.lf input,.lf select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
 <symbol id="mc" viewBox="0 0 24 24"><path fill="currentColor" d="M3 20h18v1.5H3zM5 18V9l4-2V4h6v3l4 2v9h-2v-7l-2-1v8H9v-8l-2 1v7zM11 6v2h2V6z"/></symbol>
 <symbol id="ic0" viewBox="0 0 20 20"><circle cx="10" cy="10" r="9" fill="#fff"/><path d="M5.5 10.5l3 3 6-6.5" fill="none" stroke="#0b7a3c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
 <symbol id="ic1" viewBox="0 0 20 20"><circle cx="10" cy="6.5" r="3.4" fill="currentColor"/><path d="M3 18c0-4 3-6 7-6s7 2 7 6z" fill="currentColor"/></symbol>
 <symbol id="ic2" viewBox="0 0 20 20"><path d="M10 3L1 8l9 5 7-3.9V14h1.5V8z" fill="currentColor"/><path d="M4.5 11.5v3.2c1.5 1.3 3.4 2 5.5 2s4-.7 5.5-2v-3.2L10 14.5z" fill="currentColor"/></symbol>
 <symbol id="ic3" viewBox="0 0 20 20"><path d="M10 2L1 18h18z" fill="#fff"/><path d="M9.2 7.5h1.6v5h-1.6zM9.2 13.8h1.6v1.6H9.2z" fill="#e1262c"/></symbol>
</svg>
<main>
 <section class="banner">
  <div class="brand">
   <svg width="54" height="54" viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M19.4 13a7.6 7.6 0 000-2l2.1-1.6-2-3.5-2.5 1a7.6 7.6 0 00-1.7-1L15 3h-4l-.4 2.9c-.6.3-1.2.6-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 000 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1L11 21h4l.4-2.9c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 110-7 3.5 3.5 0 010 7z"/></svg>
   <div><h1>Non-Standard MACHINE SKILL &amp; WORK READINESS MATRIX</h1><p class="sub" id="sub"></p></div>
  </div>
  <div class="legend"><b>WORK READINESS STATUS</b><div id="lg"></div></div>
 </section>
 <div class="bar">
  <div class="tabs"><button class="btn" id="tM" aria-pressed="true">Skill Matrix</button><button class="btn" id="tR" aria-pressed="false">Radar Cards</button><button class="btn" id="tS" aria-pressed="false">Machine Summary</button><button class="btn" id="tL" aria-pressed="false">Machine Location</button></div>
  <div class="tools">
  <span class="sv" id="sv"></span>
  <button class="btn" id="bEdit">✎ Edit</button>
  <button class="btn" id="bAddP" hidden>+ Technician</button>
  <button class="btn" id="bAddM" hidden>+ Machine</button>
  <button class="btn" id="bCfg">⚙ Config</button>
  <button class="btn" id="bTheme">◐ Theme</button>
  <button class="btn pri" id="bPng">▧ Export PNG</button>
  </div>
 </div>
 <div class="wrap" id="vM"><table id="tbl"></table></div>
 <section id="vR" hidden><div class="rk" id="rk"></div><div class="rg" id="rg"></div></section>
 <section id="vS" hidden><div class="sg" id="sg"></div></section>
 <section id="vL" hidden>
  <div class="lbar"><div id="sites"></div><input type="search" id="lq" placeholder="Search name, asset no. or serial" aria-label="Search machines"><span id="lc" class="rk"></span><button class="btn" id="bLEd">✎ Edit layout</button><button class="btn" id="bLAdd" hidden>+ Machine</button><button class="btn" id="bLReset" hidden>Reset layout</button><div class="zm"><button class="btn" id="zO" aria-label="Zoom out">−</button><span id="zv"></span><button class="btn" id="zI" aria-label="Zoom in">+</button><button class="btn" id="zF">Fit</button></div></div>
  <div class="rk" id="lg2"></div>
  <div class="lw"><div id="map"></div></div>
  <div class="lcard" id="ld">Click a machine on the map to see its details.</div>
  <div class="allm" id="am"></div>
 </section>
 <section class="foot" id="ft">
  <div class="note"><b>Note: <button class="btn" id="bNote">✎ Edit note</button></b><ul id="nl"></ul><textarea id="nT" hidden aria-label="Note, one line per bullet" placeholder="One line per bullet"></textarea></div>
  <div class="team"><h2>TEAM SUMMARY</h2><div class="kp" id="kp"></div></div>
 </section>
</main>

<dialog id="dtl"><div class="dlg"><h2 id="dT"></h2><p id="dS"></p><ol id="dL"></ol><div class="acts"><span></span><button class="btn" id="dX">Close</button></div></div></dialog>
<dialog id="cfg"><div class="dlg">
 <h2>Config</h2>
 <label>Subtitle<input type="text" id="fSub"></label>
 <div class="row3">
  <label>Ready ≥ (%)<input type="number" id="fR" min="1" max="100"></label>
  <label>Supervised ≥ (%)<input type="number" id="fS" min="1" max="100"></label>
  <label>Training ≥ (%)<input type="number" id="fT" min="1" max="100"></label>
 </div>
 <div class="acts"><span><button class="btn" id="cReset">Reset settings</button> <button class="btn" id="cData">Restore Excel data</button></span><span><button class="btn" id="cCancel">Cancel</button> <button class="btn pri" id="cSave">Save</button></span></div>
</div></dialog>
<dialog id="pv"><div class="dlg"><h2>Matrix image</h2><p>Right-click (or long-press) the image and choose Save image.</p><div style="overflow:auto;max-height:60vh"><img id="pvI" alt="Skill matrix" style="max-width:none;width:1400px"></div><div class="acts"><span></span><button class="btn" onclick="document.getElementById('pv').close()">Close</button></div></div></dialog>
<dialog id="rd"><div class="dlg"><h2 id="rdT"></h2><div id="rdS"></div><div id="rdV"></div><div class="acts"><span></span><button class="btn" onclick="document.getElementById('rd').close()">Close</button></div></div></dialog>
<input type="file" id="fImg" accept="image/*" hidden>

$("map").addEventListener("click",function(e){var g=e.target.closest("[data-i]");if(!g)return;lsel=+g.dataset.i;drawMap();showLD()});
$("zI").onclick=function(){lz=Math.min(1.5,lz*1.25);drawMap()};
$("zO").onclick=function(){lz=Math.max(.1,lz/1.25);drawMap()};
$("zF").onclick=function(){lz=0;renderLoc(true)};

function showView(v){view=v;var ids={M:"vM",R:"vR",S:"vS",L:"vL"},tb={M:"tM",R:"tR",S:"tS",L:"tL"};
 for(var k in ids){$(ids[k]).hidden=k!==v;$(tb[k]).setAttribute("aria-pressed",String(k===v))}
 var m=v==="M";$("bEdit").hidden=!m||!CAN;$("bPng").hidden=!m;$("bAddP").hidden=$("bAddM").hidden=!m||!edit||!CAN;$("ft").hidden=v==="L";
 if(v==="R")renderRadar();if(v==="S")renderMS();if(v==="L")renderLoc(true)}
["M","R","S","L"].forEach(function(k){$("t"+k).onclick=function(){showView(k)}});
var LOC0=LOC.sites.map(function(s){return clone(s.items)});
function locJson(){return JSON.stringify(LOC.sites.map(function(s){return s.items}))}
function applyLoc(a){a.forEach(function(it,i){if(LOC.sites[i]&&Array.isArray(it)){LOC.sites[i].items=it;LOC.sites[i].bb=null}})}
try{var lc0=JSON.parse(localStorage.getItem(LK));if(lc0)applyLoc(lc0)}catch(e){}
function locSave(){dirty.l=1;kick()}
function sn(v){return Math.round(v/10)*10}
function toast2(t,fn){var e=$("toast");e.textContent=t;var b=document.createElement("button");b.textContent="Undo";b.className="ub";b.onclick=function(){fn();e.className="toast"};e.appendChild(b);e.className="toast on act";clearTimeout(toast.t);toast.t=setTimeout(function(){e.className="toast"},7000)}
function subscribeLoc(){DB.doc("matrix/loc").onSnapshot(function(s){if(!s.exists||s.metadata.hasPendingWrites)return;var j=s.data().json;if(j===lastL||ktimer||busy||drag)return;
 var ae=document.activeElement;if(ae&&ae.closest&&ae.closest("#ld"))return;
 try{applyLoc(JSON.parse(j));lastL=j;lsel=-1;if(!$("vL").hidden){renderLoc();showLD()}}catch(e){}},function(){})}
function setLEdit(){$("vL").classList.toggle("ledit",ledit);$("bLEd").textContent=ledit?"✔ Done":"✎ Edit layout";$("bLAdd").hidden=$("bLReset").hidden=!ledit;LOC.sites.forEach(function(s){s.bb=null});lsel=-1;if(!$("vL").hidden)renderLoc();showLD()}
function showLD(){var S=LOC.sites[lsite],it=S.items[lsel];
 if(!it){$("ld").textContent=ledit?"Drag a machine to move it. Click one to edit its details, or press + Machine to add a new one.":"Click a machine on the map to see its details.";return}
 if(!ledit){$("ld").innerHTML=detail(it);return}
 var h='<h3>Edit '+KIND[it.k].toLowerCase()+'</h3><div class="lf"><label>Name<input type="text" id="eN" value="'+esc(it.n)+'"></label>';
 if(it.k==="m")h+='<label>Asset no.<input type="text" id="eA" value="'+esc(it.a||"")+'"></label><label>Serial no.<input type="text" id="eS" value="'+esc(it.s||"")+'"></label><label>Vendor group<select id="eV">'+S.legend.map(function(l){return "<option"+(l.n===it.v?" selected":"")+">"+esc(l.n)+"</option>"}).join("")+"</select></label>";
 $("ld").innerHTML=h+'</div><div class="acts"><span></span><button class="btn" id="eDel">Delete</button></div>'}
$("ld").addEventListener("input",function(e){var it=LOC.sites[lsite].items[lsel];if(!it||!ledit)return;var id=e.target.id;
 if(id==="eN")it.n=e.target.value;else if(id==="eA")it.a=e.target.value;else if(id==="eS")it.s=e.target.value;else return;locSave();drawMap()});
$("ld").addEventListener("change",function(e){if(e.target.id!=="eV")return;var S=LOC.sites[lsite],it=S.items[lsel],l=S.legend.filter(function(x){return x.n===e.target.value})[0];if(it&&l){it.v=l.n;it.f=l.f;locSave();renderLoc()}});
$("ld").addEventListener("click",function(e){if(e.target.id!=="eDel")return;var S=LOC.sites[lsite],it=S.items[lsel];if(!it)return;
 var snap0=locJson(),nm=it.n;S.items.splice(lsel,1);lsel=-1;locSave();renderLoc();showLD();
 toast2("Removed "+nm,function(){applyLoc(JSON.parse(snap0));locSave();renderLoc();showLD()})});
$("bLEd").onclick=function(){ledit=!ledit;setLEdit()};
$("bLAdd").onclick=function(){var S=LOC.sites[lsite],ms=S.items.filter(function(i){return i.k==="m"}),w=ms.length?ms[0].w:320,h=ms.length?ms[0].h:136,bb=bbox(S),wr=$("map").parentNode,
 cx=bb.x+(wr.scrollLeft+wr.clientWidth/2)/lz,cy=bb.y+(wr.scrollTop+Math.min(wr.clientHeight,500)/2)/lz,l=S.legend[0]||{n:"Other",f:"#e0e0e0"};
 S.items.push({k:"m",n:"New machine",a:"",s:"",v:l.n,f:l.f,x:sn(cx-w/2),y:sn(cy-h/2),w:w,h:h,ref:"added"});
 lsel=S.items.length-1;locSave();renderLoc();showLD();var n=$("eN");if(n){n.focus();n.select()}};
$("bLReset").onclick=function(){var snap0=locJson();applyLoc(clone(LOC0));lsel=-1;locSave();renderLoc();showLD();toast2("Layout restored to the Excel file",function(){applyLoc(JSON.parse(snap0));locSave();renderLoc();showLD()})};
$("map").addEventListener("pointerdown",function(e){var g=e.target.closest("[data-i]");if(!g||!ledit||e.button>0)return;
 var i=+g.dataset.i,it=LOC.sites[lsite].items[i];drag={i:i,g:g,sx:e.clientX,sy:e.clientY,ox:it.x,oy:it.y,moved:false};
 if(lsel!==i){lsel=i;showLD()}e.preventDefault()});
window.addEventListener("pointermove",function(e){if(!drag)return;
 if(!drag.moved&&Math.abs(e.clientX-drag.sx)+Math.abs(e.clientY-drag.sy)<5)return;drag.moved=true;
 var it=LOC.sites[lsite].items[drag.i];it.x=sn(drag.ox+(e.clientX-drag.sx)/lz);it.y=sn(drag.oy+(e.clientY-drag.sy)/lz);
 drag.g.setAttribute("transform","translate("+(it.x-drag.ox)+","+(it.y-drag.oy)+")")});
window.addEventListener("pointerup",function(){if(!drag)return;var d=drag;drag=null;if(d.moved){LOC.sites[lsite].bb=null;locSave()}drawMap()});
renderNote();
render();
initCloud();
</script>
