<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Non-Standard Machine Skill & Work Readiness Matrix</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700;800&display=swap">
<style>
:root{--bg:#e9eef6;--panel:#fff;--ink:#102a52;--mute:#5d6f8b;--line:#cfd9e8;--navy:#0b2a5b;--navy2:#123c7c;--eqh:#eaf1fc;--row:#f6f9ff;--yel:#ffd21f;
--t0:#0b9a4a;--t1:#f9c70c;--t2:#f26a0f;--t3:#e1262c;--c0:#0a8a47;--c1:#8c7800;--c2:#e0600a;--c3:#d4202a;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1624;--panel:#132238;--ink:#e4ecf7;--mute:#9fb2cc;--line:#28405f;--navy:#0a1d3d;--navy2:#14335f;--eqh:#17304f;--row:#101d31;--c0:#3fd486;--c1:#f2cf3a;--c2:#ff914a;--c3:#ff6b6f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c1624;--panel:#132238;--ink:#e4ecf7;--mute:#9fb2cc;--line:#28405f;--navy:#0a1d3d;--navy2:#14335f;--eqh:#17304f;--row:#101d31;--c0:#3fd486;--c1:#f2cf3a;--c2:#ff914a;--c3:#ff6b6f;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.4 "Noto Sans Thai","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
main{max-width:1500px;margin:0 auto;padding:12px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--yel);outline-offset:2px}
.banner{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;background:var(--navy);color:#fff;border-radius:14px 14px 0 0;padding:14px 18px}
.brand{display:flex;gap:14px;align-items:center}
h1{margin:0;font-size:clamp(1.1rem,2.1vw,1.55rem);font-weight:800;letter-spacing:.01em;line-height:1.15}
.sub{margin:4px 0 0;color:var(--yel);font-weight:700;font-size:clamp(.95rem,1.8vw,1.2rem)}
.legend{background:#fff;color:#12284c;border-radius:10px;padding:8px 14px;text-align:center}
.legend b{display:block;font-size:.85rem;letter-spacing:.02em}
.legend div{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center;font-size:.78rem;margin-top:4px}
.legend span{display:flex;align-items:center;gap:5px;white-space:nowrap}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block}
.bar{display:flex;gap:8px;justify-content:flex-end;padding:8px 0}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 12px;font-weight:500}
.btn:hover{border-color:var(--navy2)}
.btn.pri{background:var(--navy2);border-color:var(--navy2);color:#fff}
.wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:0 0 0 0}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:1750px}
th,td{padding:5px 6px;text-align:center;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
thead th{background:var(--navy);color:#fff;font-weight:700;font-size:.8rem;line-height:1.2;border-color:rgba(255,255,255,.14)}
thead th.eq{background:var(--eqh);color:var(--navy2);font-size:.72rem;font-weight:700;min-width:62px;vertical-align:bottom;border-color:var(--line)}
:root[data-theme="dark"] thead th.eq{color:#bcd3f2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) thead th.eq{color:#bcd3f2}}
thead th.grp{background:var(--navy2)}
thead svg{display:block;margin:0 auto 3px;opacity:.85}
.nm{position:sticky;left:0;z-index:2;text-align:left;min-width:180px;background:var(--panel)}
thead .nm{z-index:3;background:var(--navy);text-align:center}
tbody tr:nth-child(even) td,tbody tr:nth-child(even) .nm{background:var(--row)}
.nm b{display:block;font-size:.88rem;color:var(--navy2)}
:root[data-theme="dark"] .nm b{color:#cfe0fa}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .nm b{color:#cfe0fa}}
.nm i{font-style:normal;font-size:.76rem;color:var(--mute)}
td.pc{font-weight:800;font-size:.95rem;cursor:pointer}
td.pc:hover{background:var(--eqh)}
.c0{color:var(--c0)}.c1{color:var(--c1)}.c2{color:var(--c2)}.c3{color:var(--c3)}
td.ov{font-weight:800;font-size:1rem}
.pf svg{display:block;margin:auto}
.st{display:inline-flex;align-items:center;gap:6px;min-width:104px;justify-content:center;padding:5px 10px;border-radius:6px;color:#fff;font-weight:700;font-size:.82rem}
.st.t1{color:#3a2f00}
.st.t0{background:var(--t0)}.st.t1{background:var(--t1)}.st.t2{background:var(--t2)}.st.t3{background:var(--t3)}
.foot{display:grid;grid-template-columns:minmax(220px,1fr) 3fr;gap:12px;margin-top:12px}
.note,.team{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.note b{display:block;margin-bottom:4px}
.note ul{margin:0;padding-left:18px;color:var(--mute);font-size:.82rem}
.team h2{margin:-24px 0 10px;display:inline-block;background:var(--navy2);color:#fff;font-size:.78rem;padding:3px 16px;border-radius:12px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.kp div{text-align:center;color:var(--mute);font-size:.8rem}
.kp strong{display:block;font-size:1.6rem;line-height:1.2}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);padding:0;width:min(520px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(5,12,24,.55)}
.dlg{padding:18px;display:grid;gap:12px;max-height:80vh;overflow:auto}
.dlg h2{margin:0;font-size:1.05rem}
.dlg p{margin:0;color:var(--mute)}
.dlg ol{margin:0;padding-left:22px}
.dlg label{display:grid;gap:4px;font-size:.88rem;color:var(--mute)}
input[type=text],input[type=number]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;width:100%}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.acts{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy2);color:#fff;padding:8px 14px;border-radius:6px;font-size:.88rem;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
@media (max-width:720px){.foot{grid-template-columns:1fr}.team h2{margin-top:0}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
.btn[hidden]{display:none}
thead th.eq img{display:block;margin:0 auto 4px;max-width:56px;max-height:48px;object-fit:contain}
.im{display:block;width:100%;min-height:44px;background:var(--panel);border:1px dashed var(--line);border-radius:6px;padding:2px;margin-bottom:4px}
.im img{margin:0 auto}
.en,.in{font:inherit;font-size:.8rem;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:4px 6px;width:100%}
.en{text-align:center;font-size:.72rem}
.in.sm{margin-top:4px;font-size:.74rem}
.pi{font:inherit;font-weight:800;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:4px 2px}
.pi.c0{color:var(--c0)}.pi.c1{color:var(--c1)}.pi.c2{color:var(--c2)}.pi.c3{color:var(--c3)}
.x{border:0;background:none;color:var(--c3);font-weight:700;padding:2px 6px;line-height:1}
.nm .x{position:absolute;top:2px;right:2px}
.toast.act{pointer-events:auto}
.ub{margin-left:10px;background:none;border:1px solid #fff;color:#fff;border-radius:4px;padding:1px 8px}
.pi{width:76px;-moz-appearance:textfield}
.pi::-webkit-outer-spin-button,.pi::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.ed thead th.eq{min-width:92px}
.bar{justify-content:space-between;flex-wrap:wrap;align-items:flex-end}
.tabs,.tools{display:flex;gap:8px;flex-wrap:wrap}
.tabs .btn[aria-pressed="true"]{background:var(--navy2);border-color:var(--navy2);color:#fff}
.rk{display:flex;flex-wrap:wrap;gap:6px 10px;margin:0 0 12px;font-size:.78rem;color:var(--mute)}
.kc{display:inline-flex;align-items:center;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:2px 8px}
.kc img{height:18px;width:auto}.kc b{color:var(--ink)}
.rg{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.rc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;display:grid;gap:4px;justify-items:center}
.rc:hover{border-color:var(--navy2)}
.rc h3{margin:0;font-size:.98rem}
.rc i{font-style:normal;font-size:.76rem;color:var(--mute)}
.rc svg{max-width:100%;height:auto}
.rs{display:flex;gap:10px;align-items:center}.rs strong{font-size:1.2rem}
.rc small{color:var(--mute)}
.note textarea{width:100%;min-height:110px;font:inherit;font-size:.82rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;margin-top:6px}
.note .btn{padding:2px 8px;font-size:.76rem;margin-left:8px}
#rd{width:min(640px,calc(100vw - 24px))}
#rd svg{display:block;margin:auto;max-width:100%;height:auto}
</style>
</head>
